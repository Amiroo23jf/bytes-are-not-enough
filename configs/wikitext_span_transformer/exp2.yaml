# wikitext_span_transformer -- Experiment 2: fixed target character span w_s.
#
# Same target span w_s=128 (chars) for every tokenizer, at slack=0.05. For
# each tokenizer, solves for the token window w that reaches this span at
# the given confidence level (data.py's solve_w_for_target_span), then
# trains + evaluates an end-to-end transformer LM with that per-tokenizer
# context length. Checks whether losses converge/are close once context is
# matched in character terms rather than token terms.
#
# The character tokenizer is 1 char/token by construction, so its solved w
# is always exactly w_s=128 -- identical to its Exp 1 config. It's kept in
# this experiment's tokenizer list anyway so it appears as the baseline
# reference point in both result tables; the run script reuses Exp 1's
# char result rather than re-training it.

experiment: wikitext_span_transformer
name: exp2_fixed_w_s

window:
  mode: fixed_w_s
  w_s: 128
  slack: 0.05

tokenizers:
  - {name: char,              type: character}
  - {name: bpe_1k,            type: bpe,           vocab_size: 1000}
  - {name: bpe_4k,            type: bpe,           vocab_size: 4000}
  - {name: bpe_16k,           type: bpe,           vocab_size: 16000}
  - {name: bpe_32k,           type: bpe,           vocab_size: 32000}
  - {name: wordpiece_32k,     type: wordpiece,     vocab_size: 32000}
  - {name: sentencepiece_32k, type: sentencepiece, vocab_size: 32000}
  - {name: bert,              type: pretrained,    model: bert-base-uncased}
  - {name: gpt2,              type: pretrained,    model: gpt2}

seeds: [0]

train:
  batch_size: 128
  epochs: 1
  iterations: 20000
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 500
  ce_window: 500
  grad_clip: 1.0
  amp_dtype: bfloat16
  eval_batch_size: 256

model:
  n_layers: 4
  d_embd: 256
  d_ffn: 1024
  n_heads: 4
  init_std: 0.02
